<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ej. spać.</title><meta name="description" content="Jest późno. Taki mały ziemniak mówi, żeby iść spać."><style>

dth:220px;font-size:17px;transform:rotate(5deg);z-index:1}.scribble{font-family:'Comic Sans MS',cursive;font-size:17px;position:absolute;left:15px;top:80px;transform:rotate(-12deg);width:110px}.zz{position:absolute;left:120px;top:17px;font-size:29px;font-weight:900;transform:rotate(-15deg)}.buttons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:25px 0 15px}.bigbtn{border:2px solid #242035;border-radius:12px;padding:17px 24px;box-shadow:4px 5px 0 #242035;font-weight:800;font-size:17px;background:#fff8da;transform:rotate(-2deg)}.bigbtn:nth-child(2){background:#ff9e77;transform:rotate(2deg)}button:hover{filter:brightness(1.05)}.bigbtn:active{box-shadow:1px 1px 0 #242035;translate:3px 4px}.note{font-family:monospace;font-size:11px;opacity:.7;margin-top:21px}.sticker{position:fixed;left:-15px;top:43%;background:#fff8da;border:2px solid #242035;padding:15px 25px;transform:rotate(-12deg);font-weight:900;font-size:20px;z-index:-1}.star{position:absolute;right:35px;top:200px;font-size:50px;transform:rotate(17deg)}.bottom{display:flex;gap:20px;justify-content:center;margin:32px 0 0;flex-wrap:wrap}.bottom button{background:none;border:0;font:12px monospace;text-decoration:underline;text-underline-offset:4px}.popup{position:fixed;background:#fff8da;border:2px solid #242035;border-radius:8px;box-shadow:5px 6px 0 #242035;padding:0 22px 20px;width:300px;max-width:calc(100vw - 32px);z-index:10;animation:pop .2s ease-out}.bar{margin:0 -22px 18px;background:#d4f179;border-bottom:2px solid #242035;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;padding:7px 11px;font:12px monospace}.bar button{border:0;background:none;font-size:22px}.popup h2{font-size:26px;letter-spacing:-1px;margin:0}.popup p{line-height:1.5;font-size:14px}.popup .ok{border:2px solid #242035;background:#a99bf5;border-radius:7px;padding:9px 12px;font-size:13px}.panic{position:fixed;bottom:16px;right:17px;z-index:30;border:2px solid #242035;border-radius:20px;background:#fff8da;padding:9px 13px;font-size:12px}.hidden{display:none!important}dialog{border:3px solid #242035;border-radius:24px;background:#fff8da;color:#242035;text-align:center;max-width:410px;width:calc(100% - 30px);padding:35px;box-shadow:10px 10px 0 #242035}dialog::backdrop{background:#242035bb}dialog h2{font-size:45px;letter-spacing:-3px;margin:10px 0}dialog p{line-height:1.5}.night{background:#8374cf}@keyframes breathe{50%{height:165px;transform:translateX(-50%) rotate(2deg)}}@keyframes pop{from{scale:.8;opacity:0}to{scale:1;opacity:1}}@media(max-width:600px){.top{padding:22px 20px}h1{letter-spacing:-3px;margin-top:30px}.scene{height:265px}.bubble{right:0;max-width:175px;top:0;font-size:14px}.scribble{left:-5px;top:95px;width:75px;font-size:13px}.zz{left:60px;top:30px}.blob{width:180px;height:165px}.eye.a{left:40px}.eye.b{right:38px}.mouth{left:83px}.star,.sticker{display:none}.buttons{gap:20px}.bigbtn{font-size:15px;padding:15px 17px}.clock{margin:23px 0 7px}.top .tiny{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
